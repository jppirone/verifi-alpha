# Supabase CLI project config (2026-09-27, added alongside the GitHub Actions auto-deploy workflow --
# see .github/workflows/deploy-functions.yml). This file did not exist before: every edge function
# deploy up to this point went through the Supabase MCP tool's own deploy_edge_function call, which
# takes verify_jwt as an explicit per-call argument -- so no config.toml was ever needed for that path.
# A CLI-driven deploy (`supabase functions deploy`, what the new CI workflow runs) is different: with
# no config.toml at all, the CLI defaults EVERY function to verify_jwt = true, silently overriding
# whichever functions currently have it OFF. Confirmed live before writing this file: pulled every
# function's actual deployed verify_jwt via the Supabase MCP's list_edge_functions and cross-checked
# 1:1 against every directory under supabase/functions/ (76 local, 76 deployed, exact match, zero
# gaps either direction) -- 17 of the 76 are currently false (custom body-token/session auth, Stripe
# webhook signature verification, or internal service-role-gated endpoints that were never meant to
# require a Supabase platform JWT). Every entry below is that function's REAL, CURRENT, already-live
# setting, not a guess -- this file's only job is to make the CLI preserve exactly what's already
# deployed, not change anything. A function with no entry below falls back to the CLI's own default
# (verify_jwt = true), which is correct for every function omitted here since true is already
# everyone's default and only the 17 false exceptions strictly need to be listed -- every function is
# still listed explicitly anyway, so the intended state is self-documenting and a future change shows
# up as a real, reviewable diff instead of a silent gap.
project_id = "ihmypoduvrzymasgactc"


<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to attach your resume</title>
<style>
/* A public page for the Applitrust Attach extension's "See how" link. No sign in, no gate script, no outside fonts or images, no data calls.
   Colors and type follow the site's other pages (same tokens as index.html), with the system font only. */
:root {
  --color-bg: #161826;
  --color-text: #e9e9ed;
  --color-accent: #9184d9;
  --color-neutral-400: #b2b6ca;
  --color-neutral-500: #9397ab;
  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);
  --font-body: "Inter", system-ui, sans-serif;
  --radius-md: 8px;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
a { color: var(--color-accent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.page { max-width: 720px; margin: 0 auto; padding: 22px 16px; }
.eyebrow { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-500); margin-bottom: 6px; }
h1 { font-size: 30px; font-weight: 500; line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 6px; }
p { margin: 0 0 12px; }
.lead { font-size: 14px; color: var(--color-neutral-400); line-height: 1.7; max-width: 56ch; }
.btn { font: inherit; font-size: 14px; line-height: 1.2; color: var(--color-accent); background: transparent; border: 1px solid var(--color-accent); border-radius: var(--radius-md); padding: 8px 17px; cursor: pointer; }
.btn:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.btn:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
.done { color: var(--color-neutral-400); margin: 0; }
/* The three tutorial sections go inside <main id="steps"> later, one <section> each (see the note in the report). */
@media (max-width: 480px) { h1 { font-size: 26px; } }
</style>
</head>
<body>
  <div class="page">
    <div class="eyebrow">Applitrust Attach</div>
    <h1>How to attach your resume</h1>
    <main id="steps">
      <p class="lead">Coming soon.</p>
    </main>
    <div id="closeArea"><button type="button" class="btn" id="closeBtn">Close</button></div>
  </div>
<script>
document.getElementById("closeBtn").addEventListener("click", function () {
  window.close();
  setTimeout(function () {
    var area = document.getElementById("closeArea");
    area.textContent = "";
    var p = document.createElement("p");
    p.className = "done";
    p.textContent = "You can close this tab now.";
    area.appendChild(p);
  }, 300);
});
</script>
</body></html>
